<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>纯文本编辑器 设置</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        padding: 24px;
        background: #f6f6f7;
        color: #202124;
        font-size: 13px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #191b1d;
          color: #e8e9ec;
        }
      }
      h1 {
        font-size: 16px;
        margin: 0 0 18px;
      }
      .field {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 10px 0;
        border-bottom: 1px solid rgba(128, 128, 128, 0.16);
      }
      .field:last-of-type {
        border-bottom: 0;
      }
      .field label {
        display: grid;
        gap: 3px;
      }
      .field small {
        color: #70737a;
      }
      input[type="number"] {
        width: 92px;
        padding: 5px 8px;
        border: 1px solid rgba(128, 128, 128, 0.3);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: #4f7cff;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 18px;
      }
      button {
        padding: 6px 12px;
        border: 1px solid rgba(128, 128, 128, 0.3);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      #status.is-error {
        color: #dc2626;
      }
      #status {
        min-height: 18px;
        margin-top: 14px;
        font-size: 11px;
        color: #70737a;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
